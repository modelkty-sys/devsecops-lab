name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: 스캐너 설치
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          python3 -m pip install --quiet semgrep
      - name: 시크릿 스캔 (차단)
        run: gitleaks git . -v --exit-code 1
      - name: SAST (차단)
        run: semgrep --config p/ci --config p/python --error demo-app/
      - name: SCA · IaC (차단 — CRITICAL만)
        run: trivy fs --scanners vuln,misconfig . --exit-code 1 --severity CRITICAL
